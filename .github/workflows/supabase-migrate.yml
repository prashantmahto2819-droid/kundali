# Applies new files in supabase/migrations/ to the Supabase project whenever they are pushed.
# Alternative to Supabase's own GitHub integration (use one of the two, not both — both are safe
# together because the migrations are idempotent and tracked, but one is enough).
# Needs three repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  – personal access token from https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_ID    – the project ref (the xxxx in https://xxxx.supabase.co)
#   SUPABASE_DB_PASSWORD   – the database password of that project
# Without the secrets the job only prints a notice and succeeds.
name: Supabase migrations

on:
  push:
    branches: [main, phase-0-engine]
    paths: ["supabase/**", ".github/workflows/supabase-migrate.yml"]
  workflow_dispatch:

concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Secrets present?
        id: chk
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice::Supabase secrets not set — skipping. Add SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_ID, SUPABASE_DB_PASSWORD to enable."
            echo "run=0" >> "$GITHUB_OUTPUT"
          else
            echo "run=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.chk.outputs.run == '1'
        with:
          version: latest

      - name: Link project
        if: steps.chk.outputs.run == '1'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"        # DB password comes from SUPABASE_DB_PASSWORD

      - name: Show pending migrations
        if: steps.chk.outputs.run == '1'
        run: supabase migration list --remote || supabase migration list --linked

      - name: Apply migrations
        if: steps.chk.outputs.run == '1'
        run: supabase db push --remote --include-all --yes || supabase db push --linked --include-all --yes
